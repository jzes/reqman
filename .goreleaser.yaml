version: 2

project_name: reqman

builds:
  - id: reqman
    main: .
    binary: reqman
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
    ldflags:
      - -s -w

archives:
  - id: reqman
    ids:
      - reqman
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

nfpms:
  - id: reqman
    package_name: reqman
    ids:
      - reqman
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/jzes/reqman
    maintainer: Jose Paulo
    description: Terminal-based HTTP client for managing and sending requests from files.
    license: MIT
    formats:
      - deb
      - archlinux
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/reqman/LICENSE
      - src: README.md
        dst: /usr/share/doc/reqman/README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
